<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges">
  <!-- Black outline -->
  <rect x="3" y="1" width="6" height="1" fill="#000" />
  <rect x="2" y="2" width="1" height="6" fill="#000" />
  <rect x="9" y="2" width="1" height="6" fill="#000" />
  <rect x="3" y="8" width="6" height="1" fill="#000" />
  <rect x="4" y="9" width="4" height="2" fill="#000" />
  
  <!-- White fill body -->
  <rect x="3" y="2" width="6" height="6" fill="#fff" />
  <rect x="5" y="8" width="2" height="2" fill="#fff" />
  
  <!-- Black toe beans -->
