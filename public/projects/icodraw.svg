<svg width="800" height="460" viewBox="0 0 800 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background dithered/dot matrix -->
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#3b82f6" fill-opacity="0.35"/>
      <circle cx="10" cy="10" r="1" fill="#60a5fa" fill-opacity="0.25"/>
    </pattern>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="window-glow" x1="0" y1="0" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="drop-shadow" x="100" y="30" width="600" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="460" fill="url(#bg-grad)"/>
  <rect width="800" height="460" fill="url(#dot-grid)"/>

  <!-- Icodraw App Container Window -->
  <g filter="url(#drop-shadow)">
    <!-- Main Window Frame -->
    <rect x="130" y="45" width="540" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Left Sidebar -->
    <rect x="130" y="45" width="60" height="340" rx="14" fill="#f8fafc"/>
    <rect x="189" y="45" width="1" height="340" fill="#e2e8f0"/>
    <circle cx="148" cy="62" r="3.5" fill="#ef4444"/>
    <circle cx="160" cy="62" r="3.5" fill="#f59e0b"/>
    <circle cx="172" cy="62" r="3.5" fill="#10b981"/>
    
    <!-- Sidebar Items -->
    <rect x="142" y="85" width="34" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="142" y="105" width="28" height="6" rx="3" fill="#94a3b8"/>
    <rect x="142" y="125" width="32" height="6" rx="3" fill="#94a3b8"/>
    <rect x="142" y="145" width="24" height="6" rx="3" fill="#94a3b8"/>
    <rect x="142" y="165" width="30" height="6" rx="3" fill="#94a3b8"/>

    <!-- Top Toolbar inside App -->
    <rect x="205" y="55" width="260" height="24" rx="6" fill="#f1f5f9"/>
    <circle cx="220" cy="67" r="4" fill="#64748b"/>
    <circle cx="236" cy="67" r="4" fill="#64748b"/>
    <circle cx="252" cy="67" r="4" fill="#64748b"/>
    <rect x="268" y="64" width="80" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Center Artboard -->
    <rect x="215" y="95" width="280" height="200" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Artboard Inner Gradient Card -->
    <rect x="235" y="115" width="240" height="160" rx="8" fill="url(#window-glow)"/>
    <!-- Cartoon Mask / Icon -->
    <rect x="325" y="165" width="60" height="60" rx="18" fill="#0f172a"/>
    <circle cx="343" cy="188" r="4" fill="#ffffff"/>
    <circle cx="367" cy="188" r="4" fill="#ffffff"/>

    <!-- Floating bottom pill in artboard -->
    <rect x="305" y="270" width="100" height="22" rx="11" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.15))"/>
    <circle cx="325" cy="281" r="5" fill="#3b82f6"/>
    <circle cx="355" cy="281" r="5" fill="#64748b"/>
    <circle cx="385" cy="281" r="5" fill="#64748b"/>

    <!-- Right Properties Inspector -->
    <rect x="510" y="45" width="160" height="340" rx="14" fill="#f8fafc"/>
    <rect x="510" y="45" width="1" height="340" fill="#e2e8f0"/>
    <rect x="525" y="65" width="60" height="8" rx="4" fill="#64748b"/>
    <rect x="525" y="85" width="130" height="20" rx="6" fill="#e2e8f0"/>
    
    <!-- Color Swatches Grid -->
    <circle cx="535" cy="125" r="6" fill="#ef4444"/>
    <circle cx="555" cy="125" r="6" fill="#f97316"/>
    <circle cx="575" cy="125" r="6" fill="#eab308"/>
    <circle cx="595" cy="125" r="6" fill="#22c55e"/>
    <circle cx="615" cy="125" r="6" fill="#06b6d4"/>
    <circle cx="635" cy="125" r="6" fill="#3b82f6"/>

    <circle cx="535" cy="145" r="6" fill="#6366f1"/>
    <circle cx="555" cy="145" r="6" fill="#a855f7"/>
    <circle cx="575" cy="145" r="6" fill="#ec4899"/>
    <circle cx="595" cy="145" r="6" fill="#0f172a"/>
    <circle cx="615" cy="145" r="6" fill="#64748b"/>
    <circle cx="635" cy="145" r="6" fill="#cbd5e1"/>

    <!-- Sliders -->
    <rect x="525" y="175" width="130" height="4" rx="2" fill="#e2e8f0"/>
    <circle cx="570" cy="177" r="6" fill="#3b82f6"/>
    <rect x="525" y="195" width="130" height="4" rx="2" fill="#e2e8f0"/>
    <circle cx="590" cy="197" r="6" fill="#3b82f6"/>
    <rect x="525" y="215" width="130" height="4" rx="2" fill="#e2e8f0"/>
    <circle cx="545" cy="217" r="6" fill="#3b82f6"/>
  </g>
</svg>
