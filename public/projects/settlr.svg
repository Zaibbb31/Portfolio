<svg width="800" height="460" viewBox="0 0 800 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background dithered / dot pattern -->
    <pattern id="settlr-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#10b981" fill-opacity="0.25"/>
      <circle cx="10" cy="10" r="1" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>

    <linearGradient id="settlr-bg" x1="0" y1="0" x2="800" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Card Glow / Accent -->
    <linearGradient id="emerald-glow" x1="0" y1="0" x2="300" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="settlr-shadow" x="70" y="30" width="660" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10b981" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="url(#settlr-bg)"/>
  <rect width="800" height="460" fill="url(#settlr-dots)"/>

  <!-- Radial highlight in center -->
  <circle cx="400" cy="230" r="240" fill="#10b981" fill-opacity="0.06" filter="blur(60px)"/>

  <!-- Main Settlr Interface Window -->
  <g filter="url(#settlr-shadow)">
    <!-- App Container Frame -->
    <rect x="90" y="42" width="620" height="346" rx="16" fill="#0b0f17" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Window Top Header Bar -->
    <rect x="90" y="42" width="620" height="40" rx="16" fill="#0f172a" fill-opacity="0.8"/>
    <line x1="90" y1="82" x2="710" y2="82" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="116" cy="62" r="4.5" fill="#ef4444" fill-opacity="0.9"/>
    <circle cx="132" cy="62" r="4.5" fill="#f59e0b" fill-opacity="0.9"/>
    <circle cx="148" cy="62" r="4.5" fill="#10b981" fill-opacity="0.9"/>

    <!-- App Brand & Title -->
    <g transform="translate(180, 52)">
      <rect x="0" y="0" width="20" height="20" rx="6" fill="#10b981"/>
      <path d="M6 13.5L10 6.5L14 13.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.5 11.5H12.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="28" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.02em">Settlr</text>
      <text x="68" y="15" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="500">/ finance desk</text>
    </g>

    <!-- Header Live Badge -->
    <rect x="618" y="52" width="72" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="630" cy="62" r="3" fill="#10b981"/>
    <text x="638" y="66" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Active</text>

    <!-- LEFT COLUMN: Settlement Overview & Balance Card -->
    <g transform="translate(115, 100)">
      <!-- Balance Card -->
      <rect x="0" y="0" width="260" height="135" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="135" rx="12" fill="url(#emerald-glow)"/>

      <text x="18" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Total Settled Balance</text>
      <text x="18" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.03em">$42,850.00</text>

      <line x1="18" y1="74" x2="242" y2="74" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

      <!-- Mini stats -->
      <g transform="translate(18, 88)">
        <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Settled this week</text>
        <text x="0" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+$12,420.50</text>

        <text x="120" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Active groups</text>
        <text x="120" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">8 Groups</text>
      </g>

      <!-- Quick Action Pill Buttons -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="124" height="34" rx="8" fill="url(#badge-grad)"/>
        <text x="32" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Settle Balance</text>
        <path d="M18 17L24 17M21 14L24 17L21 20" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="136" y="0" width="124" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="160" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Split Expense</text>
        <path d="M148 17H154M151 14V20" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- RIGHT COLUMN: Real-Time Settlement Queue -->
    <g transform="translate(395, 100)">
      <text x="0" y="14" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Recent Settlements</text>
      <text x="210" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Real-time sync</text>

      <!-- Row 1: Team Offsite -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="290" height="58" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
        <circle cx="28" cy="29" r="14" fill="#10b981" fill-opacity="0.2"/>
        <path d="M22 29L26 33L34 25" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Q3 Team Offsite Retreat</text>
        <text x="52" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Split across 6 members</text>
        <text x="225" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+$3,450</text>
        <rect x="232" y="32" width="45" height="16" rx="8" fill="#10b981" fill-opacity="0.15"/>
        <text x="238" y="43" fill="#10b981" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">SETTLED</text>
      </g>

      <!-- Row 2: SaaS Infrastructure -->
      <g transform="translate(0, 92)">
        <rect x="0" y="0" width="290" height="58" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
        <circle cx="28" cy="29" r="14" fill="#38bdf8" fill-opacity="0.2"/>
        <rect x="22" y="23" width="12" height="12" rx="3" stroke="#38bdf8" stroke-width="1.8"/>
        <text x="52" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cloud Infrastructure</text>
        <text x="52" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Monthly shared pool</text>
        <text x="232" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">$890</text>
        <rect x="232" y="32" width="45" height="16" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
        <text x="238" y="43" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">SPLIT</text>
      </g>

      <!-- Row 3: Design Workspace -->
      <g transform="translate(0, 158)">
        <rect x="0" y="0" width="290" height="58" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1"/>
        <circle cx="28" cy="29" r="14" fill="#a855f7" fill-opacity="0.2"/>
        <circle cx="28" cy="29" r="5" stroke="#a855f7" stroke-width="1.8"/>
        <text x="52" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Figma Org License</text>
        <text x="52" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Design studio team</text>
        <text x="232" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+$540</text>
        <rect x="232" y="32" width="45" height="16" rx="8" fill="#10b981" fill-opacity="0.15"/>
        <text x="238" y="43" fill="#10b981" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">SETTLED</text>
      </g>
    </g>
  </g>
</svg>
